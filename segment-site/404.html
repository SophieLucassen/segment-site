<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Segment</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .error-page canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .error-content {
      position: relative;
      z-index: 1;
    }

    .error-code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -0.04em;
    }

    .error-message {
      font-size: 1.2rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <nav class="nav scrolled" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo"><span>Segment</span></a>
      <ul class="nav__links">
        <li><a href="index.html" class="nav__link">Home</a></li>
        <li><a href="projects.html" class="nav__link">Projects</a></li>
        <li><a href="contact.html" class="nav__link">Contact</a></li>
        <li><a href="contact.html" class="nav__cta">Get in touch</a></li>
      </ul>
    </div>
  </nav>

  <section class="error-page">
    <canvas id="errorCanvas"></canvas>
    <div class="error-content">
      <div class="error-code">404</div>
      <p class="error-message">This page doesn't exist. Maybe it scattered into pixels.</p>
      <a href="index.html" class="btn btn--primary">Back to home</a>
    </div>
  </section>

  <script>
    const canvas = document.getElementById('errorCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function init() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 60; i++) {
        const isGold = Math.random() > 0.6;
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: 4 + Math.random() * 8,
          alpha: 0.03 + Math.random() * 0.06,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          color: isGold ? '246, 215, 100' : '61, 220, 132',
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      requestAnimationFrame(draw);
    }

    init();
    draw();
    window.addEventListener('resize', init);
  </script>
</body>
</html>
