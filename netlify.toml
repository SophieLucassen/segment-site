# Segment — clean URLs
# The site is hand-coded .html files. Netlify already serves the
# extensionless version (/projects reads projects.html), so these rules
# 301 the .html addresses to their clean paths and make them canonical.
# force = true is needed because the .html files exist.

[[redirects]]
  from = "/projects.html"
  to = "/projects"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

